# 本地联调一键起 MySQL 8.0 + Redis 7.0（PRD §1.1）
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qiubei}
      MYSQL_USER: ${MYSQL_USER:-qiubei}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qiubei}
    ports:
      - "127.0.0.1:3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # $$ 由 Compose 转义为容器内的 $，避免把 root 密码写死在仓库或进程参数中。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    # 本地开发自动升级数据库；生产覆盖层只启动 Uvicorn，迁移按发布流程显式执行。
    command: sh -c "python -m scripts.db_upgrade && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DEBUG: "true"
      DATABASE_URL: "mysql+aiomysql://${MYSQL_USER:-qiubei}:${MYSQL_PASSWORD:-qiubei}@mysql:3306/${MYSQL_DATABASE:-qiubei}?charset=utf8mb4"
      REDIS_URL: redis://redis:6379/0
      # Windows 卷挂载下让 uvicorn --reload 生效（用轮询代替 inotify）
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - .:/app
      - prescription_data:/app/storage/prescriptions
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # 仅探测容器内 HTTP 就绪状态；Python 标准库无需额外安装 curl/wget。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql_data:
  redis_data:
  prescription_data:
